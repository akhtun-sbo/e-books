<!DOCTYPE html>
<html lang="my" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Book Reader App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Myanmar Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@300;400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sepia: {
                            50: '#fdfbf7',
                            100: '#fbf0d9',
                            200: '#f5e5c0',
                            800: '#433422',
                            900: '#2b2114',
                        }
                    },
                    fontFamily: {
                        noto: ['"Noto Sans Myanmar"', 'sans-serif'],
                        padauk: ['Padauk', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans Myanmar', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 10px;
        }

        /* Reading view theme variations */
        body.theme-light {
            background-color: #f8fafc;
            color: #1e293b;
        }
        body.theme-sepia {
            background-color: #fbf0d9;
            color: #433422;
        }
        body.theme-dark {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        /* Card background adaptive */
        .card-adaptive {
            transition: background-color 0.3s, border-color 0.3s;
        }
        body.theme-light .card-adaptive { background-color: #ffffff; border-color: #e2e8f0; }
        body.theme-sepia .card-adaptive { background-color: #f5e5c0; border-color: #e6d3a7; color: #433422; }
        body.theme-dark .card-adaptive { background-color: #1e293b; border-color: #334155; color: #f1f5f9; }

        /* UI elements theme adaptive */
        body.theme-sepia .sepia-text-muted { color: #735a3a; }
        body.theme-light .sepia-text-muted { color: #64748b; }
        body.theme-dark .sepia-text-muted { color: #94a3b8; }

        /* Smooth reading line spacing */
        .story-text {
            line-height: 2.1;
        }
        
        .story-text p {
            margin-bottom: 1.5rem;
            text-align: justify;
        }
    </style>
</head>
<body class="theme-light min-h-screen flex flex-col antialiased selection:bg-amber-200 selection:text-amber-900">

    <!-- Reading Progress Bar -->
    <div class="fixed top-0 left-0 w-full h-1 z-50 bg-gray-200 dark:bg-gray-700">
        <div id="progressBar" class="h-full bg-amber-600 transition-all duration-150 w-0"></div>
    </div>

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-opacity-90 transition-colors card-adaptive border-b shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button id="tocBtn" onclick="openTOC()" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition" title="ဝတ္ထုများ ရွေးရန်">
                    <i class="fa-solid fa-book text-lg"></i>
                </button>
                <div class="truncate max-w-[180px] sm:max-w-xs">
                    <h1 class="font-bold text-sm sm:text-base truncate leading-tight" id="headerTitle">Sunset Of The Kingdom</h1>
                    <p class="text-xs sepia-text-muted truncate" id="headerPageIndicator">Page (1 / 1)</p>
                </div>
            </div>

            <!-- Header Quick Actions -->
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button id="bookmarkBtn" onclick="toggleBookmark()" class="p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition text-amber-600" title="Bookmark">
                    <i id="bookmarkIcon" class="fa-regular fa-bookmark text-lg"></i>
                </button>
                <button id="settingsBtn" onclick="openSettings()" class="p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition" title="ဖောင့်နှင့် Theme ပြင်ရန်">
                    <i class="fa-solid fa-sliders text-lg"></i>
                </button>
                <button id="shareBtn" onclick="shareNovel()" class="p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition" title="သူငယ်ချင်းထံ မျှဝေရန်">
                    <i class="fa-solid fa-share-nodes text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-6 pb-28">
        
        <!-- Story Body Container -->
        <article id="storyArticle" class="story-text text-base sm:text-lg transition-all duration-200">
            <!-- Paginated Content Rendered via JS -->
            <div id="pageContent" class="min-h-[400px]">
                <!-- Dynamic text content appears here -->
            </div>
        </article>

        <!-- Next / Prev Page Controls -->
        <div class="flex items-center justify-between gap-4 my-8 pt-6 border-t border-gray-200 dark:border-gray-800">
            <button id="prevPageBtn" onclick="changePage(-1)" class="flex-1 py-3 px-4 rounded-xl border card-adaptive hover:bg-amber-500 hover:text-white transition flex items-center justify-center gap-2 text-sm font-semibold disabled:opacity-40 disabled:pointer-events-none">
                <i class="fa-solid fa-chevron-left"></i> Previous Page
            </button>
            
            <div id="bottomPageLabel" class="text-xs sm:text-sm font-bold sepia-text-muted px-2">
                1 / 1
            </div>

            <button id="nextPageBtn" onclick="changePage(1)" class="flex-1 py-3 px-4 rounded-xl border card-adaptive hover:bg-amber-500 hover:text-white transition flex items-center justify-center gap-2 text-sm font-semibold disabled:opacity-40 disabled:pointer-events-none">
                Next Page <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

    </main>

    <!-- Bottom Mobile Toolbar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 backdrop-blur-md bg-opacity-95 card-adaptive border-t shadow-lg px-4 py-2 sm:hidden">
        <div class="flex items-center justify-around text-center">
            <button onclick="openTOC()" class="flex flex-col items-center p-1 text-xs font-medium hover:text-amber-600">
                <i class="fa-solid fa-book text-base mb-0.5"></i>
                <span>Books</span>
            </button>
            <button onclick="openSettings()" class="flex flex-col items-center p-1 text-xs font-medium hover:text-amber-600">
                <i class="fa-solid fa-font text-base mb-0.5"></i>
                <span>Font/Theme</span>
            </button>
            <button onclick="toggleBookmark()" class="flex flex-col items-center p-1 text-xs font-medium text-amber-600">
                <i id="mobileBookmarkIcon" class="fa-regular fa-bookmark text-base mb-0.5"></i>
                <span>Bookmark</span>
            </button>
            <button onclick="scrollToTop()" class="flex flex-col items-center p-1 text-xs font-medium hover:text-amber-600">
                <i class="fa-solid fa-arrow-up text-base mb-0.5"></i>
                <span>Top</span>
            </button>
        </div>
    </nav>

    <!-- Book Selection Drawer Backdrop -->
    <div id="tocBackdrop" onclick="closeTOC()" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"></div>
    
    <!-- Book Selection Drawer -->
    <div id="tocDrawer" class="fixed top-0 left-0 bottom-0 w-80 max-w-[85vw] card-adaptive z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="p-4 border-b flex items-center justify-between">
            <h3 class="font-bold text-lg flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-amber-600"></i> Books
            </h3>
            <button onclick="closeTOC()" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div id="bookListContainer" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- Dynamic list of books -->
        </div>
    </div>

    <!-- Settings Modal Backdrop -->
    <div id="settingsBackdrop" onclick="closeSettings()" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"></div>

    <!-- Settings Modal Container -->
    <div id="settingsModal" class="fixed bottom-0 sm:bottom-auto sm:top-1/2 left-1/2 -translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-96 card-adaptive rounded-t-2xl sm:rounded-2xl z-50 hidden p-6 shadow-2xl transition-all border">
        <div class="flex items-center justify-between pb-4 border-b">
            <h3 class="font-bold text-lg flex items-center gap-2">
                <i class="fa-solid fa-sliders text-amber-600"></i> Customize Reading Experience
            </h3>
            <button onclick="closeSettings()" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="space-y-6 py-4">
            <!-- Theme Selection -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 sepia-text-muted">နောက်ခံ အရောင် (Theme)</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setTheme('light')" class="py-2.5 px-3 rounded-xl border border-gray-300 bg-white text-gray-800 text-xs font-semibold flex items-center justify-center gap-1.5 shadow-sm hover:border-amber-500">
                        <i class="fa-solid fa-sun text-amber-500"></i> Light
                    </button>
                    <button onclick="setTheme('sepia')" class="py-2.5 px-3 rounded-xl border border-amber-200 bg-[#fbf0d9] text-[#433422] text-xs font-semibold flex items-center justify-center gap-1.5 shadow-sm hover:border-amber-500">
                        <i class="fa-solid fa-book-open text-amber-700"></i> Sepia
                    </button>
                    <button onclick="setTheme('dark')" class="py-2.5 px-3 rounded-xl border border-gray-700 bg-slate-900 text-slate-200 text-xs font-semibold flex items-center justify-center gap-1.5 shadow-sm hover:border-amber-500">
                        <i class="fa-solid fa-moon text-indigo-400"></i> Dark
                    </button>
                </div>
            </div>

            <!-- Font Size Control -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider sepia-text-muted">Font Size</label>
                    <span id="fontSizeLabel" class="text-xs font-bold text-amber-600">Medium</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold">A-</span>
                    <input type="range" id="fontSizeSlider" min="14" max="24" step="2" value="18" oninput="changeFontSize(this.value)" class="w-full accent-amber-600 cursor-pointer">
                    <span class="text-lg font-bold">A+</span>
                </div>
            </div>

            <!-- Font Family -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 sepia-text-muted">Font Family</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setFontFamily('noto')" class="py-2 px-3 rounded-xl border card-adaptive text-xs font-noto font-semibold hover:border-amber-500">
                        Noto Sans
                    </button>
                    <button onclick="setFontFamily('padauk')" class="py-2 px-3 rounded-xl border card-adaptive text-xs font-padauk font-semibold hover:border-amber-500">
                        Padauk Font
                    </button>
                </div>
            </div>
        </div>

        <button onclick="closeSettings()" class="w-full py-2.5 bg-amber-600 text-white rounded-xl font-semibold text-sm hover:bg-amber-700 transition">
            Close Settings
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 sm:bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-full shadow-2xl z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2 border border-slate-700">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Copied to clipboard</span>
    </div>

    <script>
        // Books Data Structure - Place full raw novel/book HTML inside "content"
        const booksData = [
            {
                id: "book-1",
                title: "Sunset Of The Kingdom",
                author: "ခက်ဇော်",
                content: `<p>Sunset of the Kingdom 1860s<br><b>အခန်း(၁)</b><br>……………………………………<br>၁၈၅၅ ခုနှစ်၊ ဇူလိုင်လ ၁၉ ရက်နေ့။<br>အမရပူရ အဝနိုင်ငံတော်၊ စလင်းမြို့။</p>         
                <p>စက်နာရီ အရ ၈ နာရီကျော်ပြီမို့၊ မြို့ငယ်လေးမှာ အမှောင်ရိပ်ထဲတွင် တိတ်ဆိတ်ငြိမ်သက်လျက်။ ဆီမီးအလင်းရောင်းများ လင်းထိန်နေသည့် နှစ်ဧကခန့်ကျယ်သော ခြံဝန်းကျယ်ကြီး၏ တံခါးရှိရာသို့ ပေါင်းမိုးလှည်းယာဉ်တစ်စီး ဆိုက်ရောက်လာသည်။</p>
                <p>လှည်းပေါ်မှ ခေါင်းပေါင်းပေါင်းထားသူက ခပ်အုပ်အုပ်အသံဖြင့် အော်လိုက်၏။<br>“ကိုသံ..ကိုသံ..ကျုပ်ပါ...ကြက်တက်မြောက်က အာမခံပွဲစား မောင်မောင်တင့်ရယ်”<br>“သြော်...ပွဲစားပါလား...ဒီအချိန်ကြီး ဘာကိစ္စများတုန်းဗျ”<br>ခြံဝန်းထဲမှ အသံထွက်လာ၏။<br>“အသုဘအခင်းဖြစ်သွားတဲ့ကိစ္စ..မမခင် ခေါ်ခိုင်းထားလို့ပါ”<br>“သြော်..ဟုတ်သား..ဟုတ်သား”</p>
                <p>သစ်သားထူထူများဖြင့် ပြုလုပ်ထားသော တံခါးကြီးကို တအိအိပွင့်လာသည်။<br>“အနောက်ဘက် မိန်းမကျွန်တဲကို ကြွချေ..ဟိုမှာ အရီးမအုံ တို့ရှိပါတယ်..ပွဲစားကြီး”<br>ခြံစောင့်ကိုသံက မီးတုတ်ကို ခပ်မြင့်မြင့်ကိုင်ထားရင်းက လှည်းထဲသို့ အကဲခတ်ကာ ပြောလိုက်သည်။<br>“ဟ..ပွဲစားကြီး.ဒီကလေးတွေက ”<br>ခြံစောင့်၏ အမေးကြောင့် မောင်မောင်တင့်က သူ့ဘေးတွင် ထိုင်လိုက်လာသော ကောင်လေး၏ ပုခုံးကို ဖက်ရင်းပြောလိုက်သည်။<br>“သြော်...ဒါ.ကျုပ်သား ဖြူသီး လေ...ကျုပ်လုပ်ငန်းအကြောင်းကို သိရအောင် ဒီတခေါက်ခေါ်လာတာ”</p>
                <p>ဖျင်အင်္ကျီနှင့် ပုဆိုးဝတ်၊ ခေါင်းပေါင်းထားသော အသားဖြူဖြူ၊ ခန္ဓာကိုယ်ထွားထွားဖြင့် အသက်(၁၃)နှစ်အရွယ်ခန့် ဖြူသီး က ခြံစောင့်ကိုသံကိုပြုံးပြလိုက်၏။<br>“ဒါဆို ဟိုအနောက်က ကလေးတွေကရော”<br>မောင်မောင်တင့်က သက်ပြင်းချလိုက်သည်။<br>“နောက်ကတော့ ဟိုသွားလေသူ ရဲ့ သားနဲ့ သမီးပါ..”</p>
                <p>လှည်းနောက်ခြမ်းတွင် အင်္ကျီအပေါ်ပိုင်းဗလာချင်း၊ နံငယ်ပိုင်းသာသာပုဆိုးစုတ်နှင့် အသက်(၁၄)နှစ်အရွယ် ယောက်ျားလေးတစ်ယောက်နှင့် ရွယ်တူခန့်ရှိမည်ဖြစ်သော ဆံပင်အုပ်လုံးသိမ်းစ သူငယ်မလေးတစ်ယောက်။ အရှက်လုံရုံမျှ အဝတ်အစား၊ စိတ်အားငယ်နေသောမျက်လုံးလေးများကို မီးတုတ်အလင်းရောင် မပီတပီအောက်တွင် ကိုသံ တွေ့လိုက်ရသည်။</p>
                <p>“ကလေးတွေက အရွယ်ငယ်သေးသကိုး..သနားစရာပါလား..ကဲ..ပွဲစား..နောက်ကျနေမယ်..ကြွ..ကြွ”<br>လှည်းယာဉ်က ခြံကျယ်ကြီးထဲ သို့ မောင်းဝင်လာသည်။<br>ခပ်လှမ်လှမ်းတွင် ဆီမီးရောင်များတထိန်ထိန်လင်းနေသော ရေနံဝနေသည့် ခြေတံရှည်သစ်သားအိမ်ကြီး။ ဝဲလင်းဆောင်ဘက်တွင် ဗိုင်ငင်သံများနှင့် အိမ်အခိုင်းစေများ၏ သီချင်းသံများ၊ ရယ်မောသံများကြောင့် လှည်းပေါ်မှ ကလေးငယ်များက အိမ်ကြီးဆီ ငေးမောလိုက်ကြသည်။</p>
                <p>“အဲ့ဒါ သူကောင်း မမခင် ရဲ့ အိမ်ဆိုတာပေါ့...ငါ့သား”<br>ပွဲစားမောင်မောင်တင့် က လှည်းမောင်းနေရာမှ သားဖြစ်သူ ဖြူသီး ကို အိမ်ကြီးဆီ မေးငေါ့ပြရင်းပြောလိုက်သည်။<br>“သြော်..ဒါဆို..အဲ့ဒီအိမ်ကြီးပေါ် နေကြတာက သူကောင်း တွေ ချည်းပဲပေါ့”<br>“ဟားဟား..သူကောင်းတွေချည်းတော့ ဘယ်ဟုတ်မလဲ..ငါ့သားရ.. သူကောင်းတွေ ခိုင်းစေဖို့ မြေပေါင်၊မြောင်းပေါင်၊ လူပေါင် ဆိုင်ရာစာရင်းတွေကိုင်ရတဲ့ လက်သုံးစာရေးတွေ၊ အစောင့်အနေတွေ၊ ကျွန်တွေလည်း အများကြီးရှိတာပေါ့”</p>
                <p>လှည်းယာဉ်က အိမ်ကြီးကိုကျော်ကာ ခြံအနောက်ဘက်ရှိ မှောင်ကုပ်ကုပ်တဲတန်းစုဆီသို့ ဆက်လက်ဦးတည်သွား၏။ ရယ်မောသံများနှင့် ခမ်းနားလင်းထိန်နေသောထိုအိမ်ကြီးအလွန်တွင် နွားချေး၊ မြင်းချေးနံ့များ၊ ဝက်များ၏အော်သံများကိုဖြတ်ကျော်ပြီး မီးရောင်မှိန်မှိန်ဖြင့် တိတ်ဆိတ်မှောင်မဲနေသည့် တဖက်ယက်မြေစိုက်တဲကလေးများ ရှိနေသည်။</p>
                <p>တဲကလေးတစ်လုံးရှေ့အရောက်တွင် မီးခွက်အလင်းရောင်နှင့်အတူ အမျိုးသမီးကြီးတစ်ဦး ၊ သူငယ်မနှစ်ဦးတို့ မတ်တပ်ရပ်နေ၏။<br>“မောင်တင့်...တို့များ စောင့်နေတာကြာလှပေါ့..အနောက်မှာ စဏ္ဍာလ လှည်းတောင် ထွက်ဖို့ပြင်နေပြီ..လာကြ..လာကြ”<br>မောင်မောင်တင့် က လှည်းပေါ်မှ ဆင်းလိုက်သည်။<br>“ဖြူသီး...ဖြည်းဖြည်းဆင်းနော်..သား”<br>“အာ..ရပါတယ်..အဖေရ..ဒီလှည်းအတက်အဆင်းက ကျုပ်..ကျွမ်းကျင်ပါဘိ”<br>ဖြူသီးက လှည်းပေါ်မှ ခုန်ဆင်းလိုက်သည်။<br>“ဟေ့..ဝါဆိုနဲ့ ဝါခေါင်...ဆင်းကြလကွယ်”</p>
                <p>စုတ်ပြတ်ပြတ်ညစ်ထေးထေး ကလေးငယ်နှစ်ယောက်က လှည်းနောက်ဖက်မှ ဆင်းလာကြသည်။<br>“ဒီကလေးများလားကွဲ့”<br>“ဟုတ်တယ်..အရီးမအုံ”<br>“မောင်တို့မယ်တို့ မအေကြီးရဲ့ နောက်ဆုံးခရီးကို ကန်တော့သွားကြပါကွယ်..လာကြ..လာကြ..ဟဲ့..ခင်အုံ နဲ့ ခင်သုန် ကလေးများကို မီးပြပြီး ခေါ်ပါကွယ်..မှောင်ရချည်နဲ့ ခလုတ်ကန်သင်းထိုးပါ့မယ်”</p>
                <p>အမှောင်ထဲတွင် ရပ်နေကြသည့် သူငယ်မနှစ်ယောက်က မီးခွက်ကို ပြရင်း ခြံစည်းရိုးနောက်ဖက် တံခါးဆီသို့ ခေါ်လာကြ၏။ ခြံစည်းရိုးတံခါးအပြင်ဘက် မှောင်ရိပ်ထဲတွင် လှည်းတစ်စီး။ လှည်းဦးတွင် အင်္ကျီဗလာကျင်းနှင့် ပုဆိုးခါးတောင်းမြှောင်ထားသော လူတစ်ဦးက ပြောင်းဖူးဖက်ဆေးလိပ်ကြီးကို ရဲနေအောင် ဖွာလျက်။ လှည်းနောက်ဘက်တွင်တော့ ကောက်ရိုးကြမ်းများခင်းထားလျက် စောင်ကြမ်းဖြင့် ပတ်ထားသော အလောင်းတစ်လောင်း။</p>
                <p>“ဒါ မင်းတို့ မအေကြီး..မိပုံရဲ့ အလောင်းပဲ...ကန်တော့ကြကွယ်”<br>မောင်ဖြစ်သူ ဝါခေါင်က မီးခွက်အလင်းရောင်အောက်မှ မိခင်၏အလောင်းကို ကြောင်တောင်တောင်ရပ်ကြည့်နေ၏။ အစ်မဖြစ်သူ ဝါဆို က အလောင်းရှိရာသို့ ချဉ်းကပ်သွားပြီး စောင်ကို ဖယ်ကာ မျက်နှာကို တစ်ချက်ကြည့်လိုက်သည်။ ဝါထိန်ဖြူလျော့ပြီး မျက်တွင်းချောင်ချောင်၊ မေးရိုးငေါ့ငေါ့များနှင့် လူသေကောင် မပုံ ၏မျက်နှာကြီး။</p>
                <p>မီးခွက်ကိုင်ထားသော ခင်မှုန်မှာ ခေါင်းကို အလန့်တကြားတစ်ဖက်သို့ လှည့်ထားလိုက်၏။<br>“အမေ..လွတ်လပ်သွားပြီပေါ့နော်..အရီး”<br>ဝါဆို၏ အမေးကို အရီးမအုံက နှုတ်ခမ်းနှစ်ဖက်ကို တင်းတင်းစေ့ရင်း..ခေါင်းညိတ်ပြလိုက်သည်။<br>“အမေက..“ကျွန်” မဟုတ်တော့ဘူးပေါ့နော်...အရီး”<br>“သမီးလေးရယ်....”<br>အရီးမအုံ က ဝါဆို၏ ပုခုံးကို ဖက်ကာ မျက်ရည်များကျလာတော့၏။</p>
                <p>မျက်နှာလွှဲထားသော ခင်မှုန်၏ လက်တွင် ကိုင်ထားသော မီးခွက်မှ မီးလောင်လျက်ရှိသော မီးစတစ်စသည် ဘေးနားတွင်ရပ်နေသော ဝါခေါင်၏ ခြေဖမိုးပေါ်သို့ ကျသွား၏။ ဝါခေါင်ကတော့ မိခင်အလောင်းကိုသာ ငေးနေသည်။ မောင်မောင်တင့် ၏ ဘေးတွင်ရပ်လျက် ဖြူသီး က ဝါခေါင်၏ မျက်နှာကို အလန့်တကြားကြည့်လိုက်သည်။<br>“အဖေ...ဟိုမှာကြည့်ဦး”<br>မောင်မောင်တင့်က ဖြူသီး ညွှန်ပြရာသို့ ကြည့်လိုက်၏။ ဝါခေါင်၏ ဖိနပ်မပါ ဗလာခြေဖဝါးပေါ်တွင် မီးခွက်မှ မီးစသည့် တငွေ့ငွေ့တောက်လောင်နေဆဲ။ ကောင်လေး ဝါခေါင်ကတော့ ဘာမှမဖြစ်သကဲ့သို့။</p>
                <p>“ကဲ..အရီးမအုံ..ကူတိုးခပေးပါတော့....အချိန်မရှိဘူး..ကျုပ်သင်္ချိုင်းမှာ လုပ်စရာတွေရှိသေးတယ်”<br>လှည်းပေါ်မှ ဒွန်းစဏ္ဍား၏ အသံ။</p>
                <p>……………………………………<br>ပြောင်လက်နေအောင်တိုက်ထားသည့် သစ်သားကြမ်းပြင်ကြီး။ သစ်သားကြမ်းပြင်ကြီး၏ အဆုံးတွင် ကျွန်းသားဖြင့်ပြုလုပ်ထားသော ခမ်းနားလှပသည့် ဘုရားကျောင်းဆောင်ကြီး။ သစ်ကနက်သားဗုဒ္ဓရုပ်ထုရှေ့တွင် စံပယ်ပန်းများ၊ မြတ်လေးပန်းများ ကို လှပစွာထုံးဖွဲ့လျက် ဆပ်ကပ်ထား၏။ ငြိမ်ဝပ်သင်းပျံ့သော ပန်းရနံ့က အခန်းကျယ်တစ်ခုလုံးကို ငြိမ်းအေးလတ်ဆတ်စေလျက်။</p>
                <p>ဘုရားစင်ရှေ့တွင် အမျိုးသမီးတစ်ဦးက ကျောပေးလျက် မေတ္တာသုတ်ကို ခပ်တိုးတိုး ရွတ်ဖတ်နေသည်။ နောက်ဖက် ခပ်လှမ်းလှမ်းရှိ ကြမ်းပြင်ပေါ်တွင် မောင်မောင်တင်နှင့် ဖြူလုံးတို့က တိတ်တဆိတ် ဒူးတုတ်လျက်ဝင်ထိုင်လိုက်ကြ၏။ ကြမ်းပြင်အောက် တဆင့်နိမ့်သည့် ခြေနင်းတွင်တော့ ဝါဆိုနှင့် ဝါခေါင်တို့က အိမ်ကြီး၏ ခမ်းနားမှုကို ငေးမောလျက်။</p>
                <p>ခဏအကြာတွင် အမျိုးသမီးက ဘုရားဝပ်ချလိုက်ပြီးနောက် ကြေးစည်ကို တီးလိုက်သည်။ ကြေးစည်သံကြောင့် မောင်မောင်တင့်က ခါးကို ကိုင်းလျက် ခန္ဓာကိုယ်အနေအထားကို ပြင်ဆင်လိုက်သည်။<br>“ဟေ့...လက်အုပ်ချီပြီး...ခေါင်းငုံ့ထား”<br>ဖြူသီးလည်း အဖေ ပြောသည့်အတိုင်း ပြုလုပ်လိုက်၏။</p>
                <p>……………………………………<br>မမခင်။<br>စလင်းမြို့သူကောင်းမျိုး လေးရိုးအနက်မှ အချမ်းသာဆုံးဖြစ်သော ပြည်စိုးမဟာပုံဆက် ၏ အမွေဆက်ခံသူ သူကောင်း မမခင်။ ပုဂံခေတ်က စတင်ခဲ့သည့် စလင်းသူကောင်းမျိုးမှ ဆင်းသက်လာခဲ့ပြီး တချိန်က စလင်းမြို့သူကြီး၏ သမီးအဖြစ်ရော၊ အလှအရာတွင်ပါ နာမည်ကျော်ခဲ့သည့် မမခင်။</p>
                <p>တချိန်က စစ်ကိုင်းမင်း၏ ယောက်ဖ၊ နန်းမတော်မယ်နု၏မောင်၊ အင်းဝနန်းတွင်းတွင် အာဏာကြီးမားခဲ့သော စလင်းမင်သားကြီး မောင်အို၏ တော်ကောက်မှုကိုပင် ခံရလုဆဲဆဲတွင် သာယာဝတီမင်းသား၏ ပုန်ကန်မှုအောင်မြင်ခဲ့သဖြင့် ဖခင်ဖြစ်သူလည်း မြို့သူကြီး အရာကျ၊ မင်းသားကတော်လည်းမဖြစ်လိုက်ရသူ မမခင်။</p>
                <p>သို့သော်ငြား ဖခင်ဖြစ်သူ အစီအမံဖြင့် စစ်ကိုင်းသူကောင်းမျိုး ပြင်သစ်သွေးပါသူ မြေရှင်ကြီး ဦးမွန်စီယာဘတုတ် နှင့် အကြောင်းဆက်ခဲ့ရပြီးနောက် လယ်ဧကပေါင်း (၁၁၅၉၂၉)၊ ကျွန်ပေါင်း(၁၀၀)ကျော် ရှိသည်အထိ ပိုမိုချမ်းသာကြွယ်ဝခဲ့သည့် မမခင်။</p>
                <p>အညိုရောင် ပိုးရည်တောင်ဇာ ပန်းထမီအောက်တွင် မြဒေါင်းမြီးဟု ခေါ်သော ဇာအမြီးပွကြီး က ကြမ်းပြင်ကို လျော့ခနဲ ရှပ်တိုက်လိုက်သံကြားနေရသည်။<br>“ရောက်ပြီလား...မောင်မောင်တင့်”<br>မမခင် အသံကြောင့် အားလုံးခေါင်းမော့ကြည့်လိုက်ကြသည်။</p>
                <p>မမခင် ကား အဖြူရင်စီးအင်္ကျီအ‌ပေါ်တွင် အဖြူရောင်လည်ကွန့်ကိုခြုံထား၏။ လက်ထဲတွင်လည်း သစ်ကနက်သား ပုတီးကို တချောက်ချောက်စိပ်လျက်။ စလင်းသူတို့၏ ညိုသောအသားအရည် ၊ ကွမ်းငုံထားသဖြင့် ခပ်မို့မို့ဖြစ်နေသည့်ပါးပြင်။ မျက်ခုံးသေးသေးနက်နက်အောက်မှ ကြင်နာသနားတတ်ဟန်ရှိသော မျက်လုံးများ၊ မူလအတိုင်းမှာပင် ခပ်ပြုံးယောင်ယောင်ထင်ရသည့် နှုတ်ခမ်းထူထူများ။</p>
                <p>အခန်းတစ်ခုလုံး လင်းထိန်အောင် ထွန်းညှိ့ထားသည့် ဆီမီးရောင်က မမခင်၏ တည်ငြိမ်အေးချမ်းသောအလှကို ပိုမိုအရောင်လက်စေသည်။ တချိန်က အမရပူရခေတ်တွင် ခေတ်စားခဲ့ဖူးသော ပူပုံထုံးဆံတုံးလျော့လျော့ထုံးထားသည့် နဖူးပေါ်ရှိ အရေးအကြောင်းအချို့ကတော့ မမခင် ၏ ဇရာကိုစတင် ဖော်ပြပေပြီ။</p>
                <p>မမခင်က ပုတီးကို လက်က စိပ်နေရင်းမှ ဘုရားစင်ဘေးရှိ ညောင်စောင်းပေါ်တွင် တင်ပုလွဲဝင်ထိုင်လိုက်၏။ ဘေးတွင် ပဆစ်ထုတ်ထိုင်နေသော အမျိုးသမီးငယ်က ကြေးနီရောင်ကွမ်းထွေးခံကြီးကို ကမ်းလိုက်သည်။ မမခင် လက်ဖြင့်ကွယ်ကာ ကွမ်းတံတွေး ထွေးလိုက်ပြီးနောက်။<br>“မောင်တင့်ကို ရောက်လာမင့်ကို...အခြေအနေဘယ်လိုများလဲကွယ်”<br>“ပါလာပါပြီ..မမခင်..ဟော့..ဟို အောက်ဆင့်မှာပါ”</p>
                <p>မမခင်က ဆီမီးရောင်ကို လက်ဖြင့် ကွယ်လျက် ဝါဆို၊ ဝါခေါင်တို့ မောင်နှမရှိရာ လှမ်းကြည့်လိုက်သည်။<br>“ဟဲ့..ကလေးတွေပါလား..”<br>“မှန်ပါ...မိပုံ့ရဲ့ ကိုယ်ဘိုးအစားကျွန်ခံဖို့က ဒီကလေးနှစ်ယောက်သာကျန်ပါတယ်”<br>“မိပုံမှာ ခင်ပွန်းလင်ရော မရှိလို့လား..မောင်တင့်ငယ်”</p>
                <p>“မိပုံ လင် ငတပေါင်း ဟာ ပြီးခဲ့တဲ့ အင်္ဂလိပ်စစ်မှာ စစ်မှုထမ်းလိုက်ပါသွားပြီး ရန်ကုန်မှာပဲ သေပါပြီ...မိပုံ ကလည်း ဒီကလေးနှစ်ယောက်နဲ့ နွားအငှားကျောင်းလိုက်တဲ့အလုပ်လုပ်ပါတယ်..မမခိုင်ဆီမှာ ကိုယ်ဘိုး ပေါင်နှံခဲ့တုန်းက....ကျွန်တော်မျိုး သူ့ဆီက ရစရာရှိတဲ့ ကျွန်အာမခံကြေးငွေလေးကျပ်တောင် မရခဲ့သေးပါဘူး..နောက်နှစ်စာ ကိုယ်ဘိုးပေါင်ထားငွေထပ်ထုတ်မှ အာမခံကြေးကိုပါပေါင်းပေးပေးမယ်ဆိုပြီး အကြွေးထားခိုင်းထားခဲ့တာပါ...ဒါကြောင့် မိပုံ ကိုယ်စား ဒီကလေးနှစ်ယောက်ကို ကျွန်ခံဖို့ ကျွန်တော်ခေါ်လာတာပါ.မမခိုင်”</p>
                <p>မောင်မောင့်တင့်စကားအဆုံး မမခင်က အောက်အမှောင်ရိပ်ထဲမှ ကလေးများထံ လှမ်းကြည့်လိုက်သည်။<br>“ဘုရား...ဘုရား...ကိစ္စများမြောင်လူတို့ဘောင်၊..သနားစရာကလေးတွေပဲ...အနိစ္စ၊ အနတ္တ ပါလား”</p>
                <p>မမခင်က ပုတီးကို သေချာခွေလိုက်ပြီး ‌ခေါင်းအုံအထူကြီးဘေးတွင် အသာချလိုက်၏။ ထို့နောက် ခြေရင်းမှ အမျိုးသမီးငယ်ကို တချက်ကြည့်လိုက်သည်။ အမျိုးသမီးငယ်က အသင့်ယာပြီးသားကွမ်းယာကို လက်နှစ်ဖက်ဖြင့် ကမ်းပေးလိုက်၏။ မမခင် က ဘယ်ဘက်လက်ဖြင့် ကွမ်းယာကိုယူလျက် ညာဘက်လက်ဖြင့် ကွယ်ကာ ပါးစပ်ထဲ သို့ ထည့်လိုက်သည်။ မမခင်၏ ငြင်သာနူးညံ့သော လှုပ်ရှားဟန်၊ စကားပြောဟန်များကို အားလုံးက ငေးမောနေကြရသည်။</p>
                <p>“ကဲ..ကဲ..သနားဖို့ကောင်းတဲ့ ငါ့ကလေးများ..ရှေ့တိုးပြီး ဒီနားခစားစမ်းကွယ်”<br>ဝါဆိုရော၊ ဝါခေါင်ပါ မတ်တပ်ရပ်ပြီး ထလာလိုက်၏။<br>“ဟေ့..ဒူးတုပ်သွားလေ”<br>မောင်မောင်တင့်က လှမ်းအော်သည်။<br>“နေပါစေ...မောင်တင်...တောသူတောင်သားကလေးများပဲ ချက်ချင်းတော့ ဘယ်သိတတ်ဦးမလဲ..လာလာ..အဆင်ပြေသလိုသာ ခစားကြ ..ကလေးတို့”</p>
                <p>အပျိုပေါက်စပင်ဖြစ်နေသော်လည်း ရင်စည်းပုဝါအနွမ်းကလေးနှင့် အရောင်အဝါမထွက်သည့်ထမီကို ဝတ်ထားသော ဝါဆို ကို မမခင်က ကြည့်ကာ ပြုံးလိုက်သည်။ ဝါဆို၏ ဘေးနားတွင် မတ်တပ်ရပ်နေသည့် မောင်ဖြစ်သူ ဝါခေါင် ဆီသို့ အကြည့်အရောက်တွင် မမခင် ၏ မျက်လုံးများပင် ပြူးကျယ်သွား၏။</p>
                <p>မမခင် တင်မက မောင်မောင်တင့် တို့ သားအဖ အပါအဝင် အိမ်ပေါ်တွင် ရှိသမျှလူအားလုံးကလည်း ဝါခေါင် ကို တအံတသြကြည့်နေကြသည်။ နံငယ်ပိုင်းသာသာပုဆိုးသာဝတ်ထားပြီး အပေါ်ပိုင်းဗလာကျင်းထားသော ဝါခေါင်၏ ကြွက်သားကျစ်ကျစ်ခန္ဓာကိုယ်တစ်ခုလုံးတွင် ဟင်္သာရုပ်၊ ဂဠုန်ရုပ်၊ ဘီလူးရုပ်၊ နဂါးရုပ် အင်းကွက်များက နေရာမလပ်။ လက်နှစ်ဖက်နှင့် ခြေထောက်နှစ်ဖက်လုံးအပြည့်တွင်လည်း ဂါထာများ၊ အင်းကွက်များအပြည့်။ နုပျိုသော မျက်နှာတစ်ခုမှလွဲ၍ တကိုယ်လုံးတွင် နေရာမလပ်။</p>
                <p>“ဟင်....ဒီသူငယ် က ဘယ့်နှယ့်ဖြစ်တာတုန်း...ဒီအရွယ်လေးနဲ့ မင်သေ့တွေ ကိုယ်လုံးပြည့်ပါလား”<br>“သူတို့မောင်နှမက ကျောက်အူရွာက ပွဲကျောင်းဘုန်းကြီးကျောင်းမှာ နေကြတာပါ..မမခင်..ဒီကလေး ကိုယ်လုံးကဟာတွေကလည်း ပွဲကျောင်းဘုန်းကြီးတွေလက်ချက်နေမှာပေါ့”</p>
                <p>မမခင် က အသက်(၁၄)နှစ်အရွယ်ဆိုသော်ငြား ကြီးကောင်ဝင်နေပြီး ကျစ်လစ်သည့်ခန္ဓာကိုယ်ရှိနေသည့် ဝါခေါင်ကို ကြည့်ပြီး ထို့နောက် ကွမ်းတံတွေးတချက်ထွေးလိုက်၏။<br>“မင်သေ့လေး....မင်းနာမည်ဘယ်လိုခေါ်တုန်း”<br>“ဝါခေါင်ပါ”<br>“ဟိုဘက်က သမီးငယ်ကရော”<br>“ဝါဆို ပါ”<br>“ မောင်နှမများ အသက်လည်း သိပ်မကွာပါလား...ဘယ်သူက အကြီးလဲ”<br>“ကျွန်မတို့က အမွှာမောင်နှမတွေပါ”<br>“သြော်..သြော်...ထူးထူးခြားခြားပါပဲလား...ဟုတ်ပြီ..ဟုတ်ပြီ..ထိုင်လိုက်ကြတော့..ကလေးတို့”</p>
                <p>ဝါဆိုနှင့် ဝါခေါင် က မောင်မောင့်တင့်တို့ သားအဖနီးတူ ကြမ်းပြင်ပေါ် ခပ်ကြုံ့ကြုံ့ ထိုင်လိုက်ကြသည်။<br>“ဟဲ့..မိကြာအေး....နင့်သခင်မ မမဇာ ဆီ သွား.... ကိုယ်နေသက္ကရာဇ်စာချုပ် တွေထဲက မိပုံ....အေး..နေဦး...ဟဲ့..မောင်တင့်..မိပုံအဖေနာမည်က ဘယ်သူတုန်း”<br>“ကျောက်အူရွာက ငပိုးတူ သမီး မိပုံ ပါ”<br>“အေး..အဲ့ဒီနာမည်နဲ့ ကိုယ်နေသက္ကရာဇ် ကို ယူပြီး လာခဲ့ဦးလို့”<br>မမခင်အား ကွမ်းယာယာပေးနေသည့် အမျိုးသမီးက ခါးကိုကိုင်းညွှတ်လျက် ထွက်သွားသည်။</p>
                <p>“ကဲ...မောင်မောင်တင့်..ကျွန်အာမခံပွဲစားတွေထဲ..မောင် က တော်ပါပေတယ်...ဒီအတွက်လည်း မမခင်က မင်းကို မိပုံ့ဆီက ကျန်တဲ့ ကျွန်အာမခံဖိုး လေးကျပ်နဲ့အတူ အသုံး နောက်ထပ် ခြောက်ကျပ် ထပ်ပေးလိုက်မယ်...ကိုယ်နေသက္ကရာဇ်စာချုပ်မှာတော့ ကျွန်အာမခံဖို့ လက်မှတ်ထိုးသွားပါလေ”<br>မောင်မောင်တင့်က လက်အုပ်ချီမတက် ဝမ်းသာအာရး။<br>“ဟုတ်ကဲ့ပါ..မမခင်..ကျေးဇူးကြီးပါတယ်ဘုရား..ကျေးဇူးကြီးပါတယ်ဘုရား”</p>
                <p>……………………………………<br>“ရပါပြီရှင်....မောင်ပိုးတူ သမီး ရှင်မိပုံ ရဲ့ ကိုယ်နေသက္ကရာဇ်”<br>အခြားနှင့်မတူ ယဉ်ကျေးသော အသုံးအနှုန်း နှင့် အသံဝဲဝဲ‌လေး ရှိရာသို့ အားလုံး မျက်လုံးရောက်သွားကြ၏။ အုပ်လုံးသိမ်းစဆံပင်နှင့်အတူ ပေစာရွက်တစ်ရွက် နှင့် ကညစ်ကိုကိုင်လျက် မမခင်ရှေ့ လာရပ်နေသည့် အသက်(၁၆)နှစ်အရွယ် အပျိုမလေးတစ်ဦး။</p>
                <p>ထူးထူးခြားခြား ပန်းသွေးရောင်ဘက်သမ်းသောဖြူဖန့်ဖန့်အသားအရည်၊ ခပ်ချွန်ချွန်နှာတံကလေး၊ စိမ်းပြာရောင်လဲ့ထနေသည့်မျက်လုံးကလေးများကို အားလုံးသတိထားမိလိုက်ကြသည်။ မိန်းကလေးက ကြမ်းပြင်တွင် ဒူးတုပ်ထိုင်နေကြသူများဘက်သို့ တချက်လှည့်ကာ ပြုံးပြလိုက်၏။ ထို့နောက် မမခင် ၏ ညောင်စောင်းဘေးမှ ကတ္တီပါကွတ်သင်ဖြူးစပေါ်တွင် ဝင်ထိုင်လိုက်သည်။</p>
                <p>“ကဲ...ဝါဆိုနဲ့ဝါခေါင်...ဒါကတော့ကလေးတို့ရဲ့ သွားလေသူမိခင်ကြီး မိပုံက မမခင် ဆီက ကိုယ်ဘိုးငွေယူပြီး လူပေါင်ထားတဲ့ ကိုယ်နေသက္ကရာဇ်ပဲ....ဇာဇာ..မိပုံရဲ့ ကိုယ်နေသက္ကရာဇ် သူတို့ကို ပြလိုက်စမ်းကွယ်”<br>ဇာဇာ က မီးခွက်တစ်ခွက်ကို ယူကာ ကြမ်းပြင်တွင်ချလိုက်သည်။ ထို့နောက် ပေစာကို မီးအလင်းရောင်တွင် ထောင်ပြလိုက်၏။<br>“အဲ့ဒါကို ကျွန်မ ကြည့်လို့ရမလား”<br>ဝါဆို၏ စကားကြောင့် မမခိုင် မှာ မျက်မှောင်ကြုံ့သွား၏။ အခန်းထဲတွင်ရှိနေသော လူများကလည်း ဝါဆို ထံ အကြည့်ရောက်သွား၏။ မမခင်က ခေါင်းညိတ်လိုက်သဖြင့် ဇာဇာက ပေစာရွက်ကို ဝါဆိုထံသို့ ကမ်းပေးလိုက်သည် ။ ဝါဆိုက ပေစာရွက်ကို မီးခွက်အလင်းရောင်ဘက်သို့ ကိုင်းကာ စာကို အသံထွက်ဖတ်လိုက်သည်။</p>
                <p>“သက္ကရာဇ် ၁၂၁၆ ခု၊ တန်ခူးလဆန်း ၂ ရက်၊ ကျောက်အူရွာနေ ငပိုးတူသမီး မိပုံ မှ နန်းတော်သစ်တည်ဆောက်လုပ်အားပေးလူစားထိုးငွေ နှင့် မြို့သူကြီးထံ ကွမ်းရေတော်ဖိုးငွေပေးသွင်းရန် အတွက် စလင်းမြို့နေ၊ သူကောင်း မမခင်ထံမှ ဟင်္သာလေးချိန် ငွေစင် ၄၀ိ ကျပ်ကို မိမိကိုယ်ဘိုးထားကာ “ရှင်မပွား၊သေမဆုံး” အပေါင်ဝယ်ယူပါသည်။ ကိုယ်ဘိုးအတိုးနှုန်းကား လစဉ်လဆန်း ၄ ကျပ်စီ နှင့် သုံးနှစ်သုံးသီးခိုင်းစေပြီးမှ တိုးရင်းပေါင်း ရွေးယူနိုင်စေ။ ကိုယ်ဘိုးအပေါင်ခံသူ ကျွန် မိပုံသည် မမခင်၏ နေအိမ်တွင် ကိုယ်နေကျွန်ဖြစ် ညဉ့်အိပ်ညဉ့်နေ ခိုင်းပိုင်စေ၊ မြစ်ကူးချောင်းခြား၊ သစ်နိမ့်သစ်မြင့်၊ အသက်အတက် ခိုင်းပိုင်စေ၊ သေခန်းရှင်ခန်း၊ တပြာလက်ဝါး ဆုံးမပိုင်စေ။ ကျွန် မိပုံ ကို “ရှင်မပွား၊သေမဆုံး” အပေါင်ဝယ်အဖြစ် မခိုမကပ်၊ မထွက်မပြေး၊ အစေကျွန်ခံပါစေဟု မြောက်ကြက်တက်ရွာနေ အသည်သား မောင်မောင်တင့်က အာမခံပါသည်။ ကျွန်မိပုံသည် ကိုယ်ဘိုးငွေယူပြီး အစေမခံ၊ တိမ်းရှောင်ထွက်ပြေး၊ အရှင်သူဟောင်းမင်းနှုတ်စိုးယူ၊ သေဆုံးမူ က ကိုယ်ဘိုးအစားပေးလျော်ရန် တမူ ကိုယ်ဘိုးအစား ကျွန်ခံသူရှာရန် မောင်မောင်တင့်မှ တာဝန်ယူပေးရမည်။ ဤကိုယ်နေ သက္ကရာဇ်စာချုပ်ကို သဘောတူသိရှိကြောင်း ပေါင်သူ မိပုံ ၊အပေါင်ခံ သူကောင်းမမခင်၊ စာစီစာရေး ငကျော်ခ ၊ ငွေစင်ရေပေးသူ မအုံ ၊ အာမခံသက်သေ မောင်မောင်တင့် တို့ မှ အောက်ပါအတိုင်း လက်မှတ်ထိုးကြသည်”</p>
                <p>ဝါဆို၏ စာဖတ်သံအဆုံး တခန်းလုံး ခေတ္တမျှ တိတ်ဆိတ်သွား၏။<br>“ပုဒ်စပ် ချောမြေ့၊ သန္ဓေ့ ခြားဖြတ်၊ သံလွှတ် ဖွင့်ဆို၊ ရှည် တို လေး ပေါ့၊ တင်း လျော့ နိဂ္ဂဟိတ်၊ အစိတ်အဖြာ အင်္ဂါဆယ်စု၊ ဖတ်ရွတ်မှု” ဟူသော နန်းတွင်းစာတော်ဖတ်တစ်ဦးအလား အထစ်အငေါ့မရှိ ဌာန်ကရိုဏ်းကျစွာ ရွတ်ဖတ်သွားသော ဝါဆို၏ အသံကား အားလုံးကို တိတ်ဆိတ်သွားစေခြင်း။</p>
                <p>“သြော်...ဝါဆို..သမီးလေးက.. စာဖတ်တတ်တယ်လား”<br>“ဖတ်တတ်ပါတယ်...မမခင်...”<br>မမခင်က ထွေးခံကို ယူကာ နောက်တကြိမ် ကွမ်းကို ထွေးလိုက်သည်။<br>“ကဲ..ဒါဆိုလည်း...သမီးတို့အမေရဲ့ကိုယ်နေသက္ကရာဇ်စာချုပ်အရ “ရှင်မပွား၊သေမဆုံး”ဖြစ်တဲ့အတွက် ဒီက ဝါဆို၊ဝါခေါင်တို့ဟာ မမခင်ဆီမှာ အစေခံအဖြစ်နေရတော့မယ်ဆိုတာ..သိပြီလား”<br>“ကျွန်တော့်အမေ ရဲ့ တာဝန်ကို ကျွန်တော်တို့ မောင်နှမ ဆက်ယူမှာပါ..အရီး..စိတ်ချပါ”<br>ဝါခေါင် က ဝင်ပြောလိုက်သဖြင့် မမခင်က ပြုံးလိုက်သည်။</p>
                <p>“ဟုတ်ပါပြီ..ကဲ..မှင်သေ့လေးရေ...နောင်ကို အရီးလို့မခေါ်ရဘူး...မမခင်လို့ပဲ ခေါ်ရမယ်နော်...ကဲ..ဇာဇာ...ပေရွက်အသစ်မှာ ဝါဆို၊၊ ဝါခေါင်တို့အတွက် ကိုယ်နေသက္ကရာဇ်အသစ်ရေး ၊ ပြီးရင် သူတို့ ရော၊ အာမခံမောင်မောင်တင့်ရော ဖတ်ပြီး လက်မှတ်ထိုးခိုင်း၊ ပြီးရင် ကျွန်ခေါင်းတွေလက် အပ်ပြီး နေစရာစီစဉ်ခိုင်းလိုက်”</p>
                <p>……………………………………<br>၁၈၅၃ နှစ်ဦပိုင်းတွင်ပင် အမရပူရ၊ အင်းဝနန်းရှင် ပုဂံမင်း မောင်လူကလေး မှာ အဖေတူ အမေကွဲ ညီများဖြစ်သူ မင်းတုန်း၊ ကနောင် ညီနောင်တို့၏ ပုန်ကန်မှုတွင် ရှုံးနိမ့်ခဲ့ပြီး ထီးနန်း ကို စွန့်ခဲ့ရသည်။ ရှင်ဘုရင်ဖြစ်လာသော မင်းတုန်းမင်းသားက အကိုဖြစ်သူ ရှင်ဘုရင်ဟောင်းကို ကွပ်မျက်ခြင်းမပြုပဲ အိမ်တော်သီးသန့်ဖြင့် အကျယ်ချုပ်ထားခဲ့၏။ မင်းတုန်းမင်းသည် အင်္ဂလိပ်နှင့် ဖြစ်ပွားလက်စဖြစ်သော စစ်ပွဲကို အပစ်ရပ်စစ်ပြေငြိမ်းရေးကို ရယူပြီးနောက် နန်းမြို့တော်ကို အမရပူရမှာ မန္တလေးဆိုသည့်မြို့သစ်သို့ ပြောင်းရွှေ့ရန် စီမံကိန်းစတင်ခဲ့သည်။</p>
                <p>မြန်မာနိုင်ငံအတွင်းရှိ ပြည်သူလူထုမှာ ပြည်ပကျူးကျော်စစ်များ၊ ပြည်တွင်း နန်းတွင်းအာဏာလုပွဲများကြောင့် ကျဆင်းနေသော စီးပွားရေးအပြင် စစ်မှုထမ်းခေါ်ယူခံရခြင်း၊ အခွန်စရိတ်မျိုးစုံကောက်ခံခြင်းဒဏ်ကို အလူးအလဲ ခံနေကြရ၏။ ထိုသော ဆင်းရဲဒုက္ခထဲတွင် မြန်မာ့ထီးနန်းအဆက်ဆက်အတွက် အချက်အချာကျသော စလင်းနယ်ကြီး မှ ပြည်သူများလည်း ပါဝင်ခဲ့သည်။</p>
                <p>စလင်းနယ်တွင်လည်း အရွယ်ရှိယောက်ျားသားများက စစ်ပွဲများတွင် အဓမ္မစစ်မှုထမ်းရန် ခေါင်ဆောင်သွားခံရခြင်း၊ အုပ်ချုပ်ရေး မတည်ငြိမ်မှုကြောင့် အဆင့်ဆင့်ဝန်ထမ်းတို့၏ လာဘ်ပေးလာဘ်ယူကြီးထွားလာခြင်း၊ အမျိုးမျိုးသော မင်းမှု နန်းရာ အခွန်ငွေများပေးဆောင်ရခြင်း တို့ကြောင့် ဆင်းရဲတွင်းနက်သည်ထက် နက်လာကြသည်။ ထိုအချိန်တွင် စလင်းနယ်ကြီး၏ အုပ်ချုပ်ရေးနှင့် စီးပွားရေးကို ကြိုးကိုင်ချယ်လှယ်ထားသူများမှာ “သူကောင်း” ဟုခေါ်သော လူတန်းစားများပင်။</p>
                <p>အေဒီ ၁၁၁၂ စလင်းနယ်ကြီးကို စလင်းမြို့သူကြီး မဟာပုံ နှင့် ကြက်တက်မြောက်ရွာ၊ ရေငံရွာ၊ လက်ပွေ့ဆိုင်ရွာတို့မှ သူကြီးသုံးဦးတို့ ပူးပေါင်းတိုးချဲ့ကာ အုပ်ချုပ်ခဲ့ကြသည်။ ထိုသူကြီး (၄)ဦး မှ ပြည်စိုးမဟာပုံ၊ ပြည်စိုးလက်ျာ၊ ပြည်စိုးသမန္တစည်သူ၊ ၊ပြည်စိုးစက္ကရာဇာ ဟူသော စလင်းသူကောင်းမျိုး များ ဖြစ်ပေါ်လာခဲ့၏။ အမည်ရှေ့တွင် သူကောင်း (သဂေါင်းဟုအသံထွက်) ဟု ထည့်ခေါ်ရသဖြင့် သူကောင်းမျိုးများဟုလည်း ခေါ်တွင်ခဲ့ခြင်းပင်။</p>
                <p>စလင်းမြို့၏ အုပ်ချုပ်ရေး၊ လုံခြုံရေး၊ တရားစီရင်ရေး အာဏာအဝဝကို ချုပ်ကိုင်ထားနိုင်သည့် စလင်းမြို့သူကြီးရာထူးကိုလည်း ထိုသူကောင်းမျိုး (၄)မျိုးမှ ဆင်းသက်လာသူများက ခေတ်အဆက်ဆက် ရယူထားခဲ့ကြသည်။ ပဒေသရာဇ်ခေတ်အဆက်ဆက် ၊ ရှင်ဘုရင်အဆက်ဆက် သူကောင်းမျိုး လေးရိုးအကြား မြို့သူကြီးရာထူး ရနိုင်ရေးအတွက် နည်းမျိုးစုံဖြင့် ယှဉ်ပြိုင်ရယူပွဲများဖြစ်ပွားလာသည်မှာလည်း ရာစုနှစ် ကိုးစုပင် ကြာမြင့်ခဲ့ပြီဖြစ်သည်။</p>
                <p>စလင်းနယ်ကြီး၏ အုပ်ချုပ်ရေးအာဏာကို ရရှိထားသူ မြို့သူကြီးများမှာ ပြည်စိုးဘွဲ့ခံ “သူကောင်း” များဖြစ်သကဲ့သို့ စလင်းနယ်ကြီး၏ စီးပွားရေးကို အုပ်စီးထားသူများမှာလည်း “သူကောင်း” များပင်။ စလင်းနယ်အတွင်းကျေးရွာများမှ ဆင်းရဲသားများ၊ တောင်သူလယ်သမားများသည် စစ်မှုထမ်းကိုယ်စားလူငှားထည့်ရန်ငွေလိုသည့်အခါ၊နန်းတော်အခွန်တော်ကိစ္စများကြောင့် ငွေပေးရန်ရှိသည့်အခါ၊ အလှူမင်္ဂလာ၊သားရှင်ပြု စသည့် အလှူအတန်းအတွက် ငွေလိုသည့်အခါ၊ အမှုအခင်းရှေ့နေတရားစရိတ်ပေးရန်ရှိသည့်အခါ၊ စားရန် စပါးမရှိသည့်အခါမျိုးတွင် သူကောင်းမျိုးများထံမှ စပါး၊ငွေကြေး စသည်ဖြင့်ကို ချေးယူစားသောက်ရသည်။</p>
                <p>ထိုသို့စားသောက်သည့်အခါတွင်လည်း လယ်ပေါင်၊ မြောင်းပေါင်၊ လူပေါင် ဟူသော အပေါင်သုံးမျိုးထား၍ အတိုးနှုန်းနှင့်တကွ ပေါင်ကြရသည်။ လယ်ဆိုသည်မှာ စိုက်ပျိုးလယ်မြေကိုပေါင်ခြင်းဖြစ်ပြီး မြောင်းပေါင်မှာ လယ်မြေများကို ရေသွင်းသည့် မြောင်းပေါင်များကို အပေါင်ခံခြင်းဖြစ်သည်။ လူပေါင်ခံရာတွင် ပေါင်သူသည် ကိုယ်ဘိုးငွေဟုခေါ်သော ငွေရယူပြီးနောက် ခင်ပွန်း၊ ဇနီး၊ သားသမီး၊ ညီ၊ ညီမ တူ၊တူမ သို့မဟုတ် မိမိကိုယ်တိုင်ပင် အပေါင်ခံသူထံ ပေါင်နှံနိုင်သည်။ အတိုးနှုန်းမှာလည်း ငွေယူလျှင်‌သော်လည်းကောင်း၊ စပါးယူလျှင်သော်လည်းကောင်း ယူသည့် ပမာဏ၏ ဆယ်ရာခိုင်နှုန်းကို လစဉ်အတိုးအဖြစ်‌သတ်မှတ်၏။</p>
                <p>လူပေါင်ခံရာတွင် “ရှင်မပွားသေမဆုံး”နှင့် “ရှင်ပွားသေဆုံး”ဟူ၍ စနစ်နှစ်မျိုးရှိသည်။ “ရှင်မပွား၊သေမဆုံး” ဟူသည်မှာ ကျွန်အဖြစ် ပေါင်နှံခြင်းခံရသူသည် အစေကျွန်ခံနေစဉ်အတွင်း အိမ်ထောင်ကျ၍ ကလေးရလျှင်သော်လည်းကောင်း၊ အစေကျွန်မခံမီက အိမ်ထောင်ရှိလျက် ကျွန်ခံနေစဉ် ကလေးရသွားလျှင်လည်းကောင်း ထိုကလေးများသည် အပေါင်ခံသူနှင့် မည်သို့မျှမဆိုင်၊ ထိုကလေးများကို အပေါင်ခံသူက ပိုင်ဆိုင်ခွင့်မရ။ ကျွန်အသက်ရှင်နေသော်လည်း ယင်းထံမှ မွေးဖွားလာသူများနှင့် မပတ်သက်ချေ။ သို့သော် ကျွန်ခံနေစဉ် သေဆုံးပါက ကိုယ်ဘိုးငွေနှင့်အတိုးကို မဆုံးရှုံးစေပဲ သေဆုံးသူနှင့် အမွေဆက်ခံသူ၊ ပတ်သက်သူ တစ်ဦးကို အစားထိုးပေးရခြင်းဖြစ်သည်။</p>
                <p>“ရှင်ပွားသေဆုံး” ဆိုသည်မှာ သေဆုံးသူက ကျွန်ခံနေစဉ်အတွင်း ရရှိသည့်ကလေးများကို အပေါင်ခံသူက ပိုင်ဆိုင်လျက်၊ ကျွန်ခံနေစဉ်သေဆုံးပါကလည်း နောက်ထပ်လူစားပေးရန်မလိုဟု ဆိုလိုသည်။ ထိုသို့သော ကိစ္စများအတွက် ကျွန်အာမခံလုပ်ပေးသော အသည်သားများက အပေါင်ခံနှင့် ပေါင်သူ နှစ်ဦးကြား ငွေကြေးရာခိုင်နှုန်းတစ်ခုရယူကာ အာမခံပေးလေ့ရှိသည်။ ကျွန်ခံနေစဉ် ထွက်ပြေးပါက ကျွန်အာမခံပေးသူက လိုက်လံဖမ်းဆီးပေးရခြင်း၊ ကိုယ်စားထည့်ရန် လူရှာပေးခြင်း များပြုလုပ်ရသည်။ သို့မဟုတ်ပါက အာမခံသူကိုယ်တိုင် ကိုယ်ဘိုးပေးလျော်ခြင်း၊ ကျွန်ခံခြင်းတို့ လုပ်ပေးရ၏။ ယခုလည်း ကျွန်အာမခံဖြစ်သည့် မောင်မောင်တင့် သည် ကွယ်လွန်သူ မိပုံကိုယ်စား ဝါဆို၊ဝါခေါင် မောင်နှမနှစ်ယောက်အား ကျွန်အဖြစ် အစားထိုးပေးခဲ့ရခြင်းပင်။</p>
                <p>……………………………………<br>“အဖေ....ဟိုဝါဆို ဆိုလား...အစ်မက မိန်းမတန်မဲ့ စာဖတ်တာ ကျွမ်းဝင်ချက်ဗျာ..အသံလေးကလည်း သာ..ရုပ်ကြီးစင်က မင်းသမီးကျလို့..”<br>လရောက်စမ်းတဝါးအောက် လှည်းကိုထိန်းကျောင်းမောင်းလာသည့် မောင်မောင်တင်က သားဖြစ်သူ ဖြူသီး၏ စကားကို ခေါင်းညိတ်လိုက်သည်။<br>“ပြောသာပြောရတယ်..အဲ့ဒီ အစ်မ က အဝတ်အစားသာ ညစ်စုတ်စုတ်ပေမယ့် မျက်နှာလေးက လှတယ်..အဖေ”<br>“ဟေ့ကောင်...ဖြူသီး”<br>“ဗျ”<br>“မင်း..ကျွန်ဖြစ်ချင်လို့လား”<br>“ဟာ..ဘာဆိုင်လဲဗျ”<br>“အဲ့ဒါ ကျွန်မ ကွ...ကျွန်မ နဲ့ ယူရင် မင်းလည်း ကျွန်အစုထဲ ပါသွားမယ်..မင်းနားလည်လား”<br>“ဟ..အဖေရ..ကျုပ်က ဘာပြောနေလို့တုန်း...လှတယ်ပဲပြောရသေး”<br>“တော်...တော်..ဟေ့ကောင်....ဘယ်လောက်လှလှ ကျွန် က ကျွန်ပဲကွ...ငါ့သားက အသည်မျိုး..ဒီလိုမာနမျိုးထားစမ်း”</p>
                <p>“မဟုတ်ပါဘူးဗျာ..အဲ့ဒီအမ စာအံသွားတာ ဌာန်ကရိုဏ်းကိုကျလို့..အထစ်အငေါ့မရှိ နားထောင်ကောင်းချက်...ခင်ညားတောင် ဒီအရွယ်ကြီးနဲ့ ကကြီးခခွေး အံကြိတ်ဖတ်နေရတာမဟုတ်လားဗျ..အဖေရ”<br>“ဟေ့ကောင်..တော်တော့ ဖြူသီး”<br>“နို့..အဲ့သဟာမလေး မဟုတ်ပဲ...ဟိုမျက်လုံးစိမ်းလေးဆိုရင်ရော..အဖေ..သူလည်း လှသား”<br>“အဲ့ဒါ သူကောင်း မမခင်ရဲ့လင် မွန်စီယာကြီး ဘက်က ပါတဲ့ တူမ ကွ၊ ပြင်သစ်ကပြားမလေး ၊ သူလည်း သူကောင်းမျိုးပဲ....မှတ်ထား...သူကောင်းတွေဟာ မင်းမျိုးစိုးမျိုးမဟုတ်ရင် သူတို့ သူကောင်းမျိုး ချင်းပဲ အိမ်ထောင်ပြုကြတယ်..ငါ့သား”</p>
                <p>“အဖေ့ဟာကလည်း ကျုပ်မှာ နှစ်ယောက်လေးတွေ့တာ...တစ်ယောက်ကျွန်၊ တစ်ယောက်က သူကောင်း..ဘယ့်နှယ့် ကိုယ်နဲ့ ကိုက်တာ တစ်ယောက်တောင်မရှိပါလား..လူလူချင်းပဲဗျာ...ချစ်ရင် ကြိုက်ရင် ယူကြပေါ့ဗျ..နော့”<br>မောင်မောင်တင့် က နွားလှည်းကို အရှိန်လျော့လိုက်သည်။<br>“ငါလိုးကျလို့...မင့်အသက်က ဘယ်လောက်ရှိသေးလို့ ဒီလောက် တဏှာကြောထနေရတာတုန်းဟ..ဖြူသီးရ ”<br>“အို..ဒါကတော့ ခင်ဗျားသားကို အဖေရ”<br>ဖြူသီးစကားကြောင့် မောင်မောင်တင့်က တဟားဟားအော်ရယ်လိုက်သည်။</p>
                <p>“အဖေ..ကျုပ်တခု မေးချင်တယ်.သူကောင်မျိုးဆိုတာက မျိုးရိုးစဉ်ဆက်ဖြစ်မှရတာမျိုးလား”<br>“သူကောင်းမျိုးဆိုတာ မျိုးရိုးအရဖြစ်လာတာရှိသလို..ရှင်ဘုရင်က ချီးမြှင့်သတ်မှတ်ပေးတာလည်း ရှိသကွ”<br>“သြော်..အဲ့ဒီတော့...ဟော့ဒီစလင်းတကြောမှာ သူကောင်းရိုး လေးရိုးဟာ ကြီးစိုးလာတာ ကြာကြာလှပြီ..မြို့သူကြီးနေရာကနေ သူဌေးသူကြွယ်နေရာအထိ သူတို့ချည်းမဟုတ်လား”<br>“ဟုတ်တယ်လေကွာ”<br>“ကျုပ်တို့ကရော သူကောင်းမျိုးမဖြစ်နိုင်ဘူးလား၊ ကျုပ်က ဘုရင့်အနားခစားပြီး တချိန်မှာ ဘုရင်က ချီးမြှောက်တဲ့အခါ သူကောင်းမျိုးဖြစ်လာနိုင်တာပဲလေ..အဖေ”</p>
                <p>မောင်မောင်တင့်က ပြုံးလျက် ခေါင်းခါလိုက်သည်။<br>“ဖြူသီး..မောင်က အဖေ့ရဲ့ သားအကြီးဆုံး၊ အောက်က သားနှစ်ယောက်မှာ မောင်ညိုပွင့် ကတော့ အားကိုးမရသူ ဒုက္ခိတ၊ မင်းညီမလေး ညက်စိမ်း ကလည်း ကလေးရှိသေးတာ..မင်းအောက်က အငယ်တွေကို မင်းက စောင့်ရှောက်ရမှာပဲ....ပြီးတော့ မင်းခစာဆိုတာ ကမ်းနားသစ်ပင်ပါကွာ..အန္တရာယ်လည်းကြီးလှပါတယ်..ဒီနေ့ မင်းကို ဒီနေရာခေါ်လာရတာလည်း အဖေ့ရဲ့ အလုပ်အကိုင်သ‌ဘောတွေကို နားလည်အောင်ခေါ်လာတာ..နောင်တချိန် မင်းကို အဖေ့ရဲ့အလုပ်တွေ လွှဲခဲ့ရမှာကွ”</p>
                <p>“အဖေ က ဒီလိုမျိုး သူများကို ကြမ်းပြင်မှာထိုင်ပြီး ကျေးဇူးကြီးလှပါချည်ရဲ့လုပ်ရတာမျိုးကို ကျုပ် မလုပ်ချင်ဘူး”<br>မောင်မောင့်တင့်က ပြုံးလိုက်သည်။<br>“မင်းက ဘာလုပ်ချင်တာတုန်း ဖြူသီးရ”<br>“အခု အမရပူရမှာ မင်းတုန်းမင်းသားဆိုတာ ရှင်ဘုရင်ဖြစ်တယ်ဆို..အဖေရ”<br>“အေး.ဟုတ်တယ်..ရှင်ဘုရင်အသစ်ဖြစ်လာတယ်...မြို့တော်အသစ်လည်း မကြာခင်ဖြစ်လာတော့မယ်”<br>“ဒါဆို ကျုပ် အမရပူရကိုသွားမယ်....လက်အုပ်ချီရှိခိုးရတာချင်းအတူတူ ဒီက တောသူဌေးတွေကို မရှိခိုးဘူး... ဘုရင်တွေကို ရှိခိုးပြီး..ဒီမှာ သူကောင်းမျိုးပြန်လုပ်မှာပေါ့”</p>
                <p>မောင်မောင်တင့်က သားဖြစ်သူကို တချက်ကြည့်ကာ ခေါင်းခါရမ်းလိုက်သည်။<br>“ဖြူသီးရာ..စိတ်ကူးကတော့ နေရာကျသပေါ့လေ”<br>“စိတ်ကူးမဟုတ်ဘူး..အဖေ ပြောဖူးတယ်မဟုတ်လား...ကျောက်ဆောက်က ကျုပ်တို့ဘကြီး ဦးရွှေရေးမှာ မောင်သံမှိုဆိုတဲ့ သားတစ်ယောက်ရှိတယ်၊ သူက အခု အမရပူရနေပြည်တော်မှာ မင်းညီမင်းသားတွေကို စာဝါချပေးရတဲ့ စာချဘုန်းကြီးဖြစ်နေသတဲ့ဆို...သူ့ဆီ ကျုပ်သွားမယ်”<br>“နေစမ်းပါကွာ.သူ့ဟာသူ နေပါစေ....ငါတောင် သူ့မြင်ဖူးတာမဟုတ်ဘူး...ဖြူသီးရ”<br>“အို..ကိုယ်ဆွေမျိုးချင်းပဲ...တွေ့တော့ ပြောကြဆိုကြရမှာပါဗျ..ကျုပ်ကတော့ သူကောင်းမျိုးတွေ ကိုဒီလိုကြီး ရှိခိုးမနေချင်ဘူး..ကိုယ်တိုင် သူကောင်းပဲဖြစ်ချင်တော့တယ်”<br>မောင်မောင်တင့် ၏ သက်ပြင်းချသံအဆုံးတွင် လှည်းဝင်ရိုးသံ တကျွိကျွိက ညအခင်းထဲ စည်းချက်ကျစွာဖြင့် ထွက်ပေါ်လျက်။</p>`
            }
        ];

        let currentBookIndex = 0;
        let currentPageIndex = 0;
        let isBookmarked = false;
        let toastTimeout = null;

        // Auto Page Break Generator
        function autoPaginate(contentHtml, fontPx = 18) {
            // Calculate character threshold according to font size
            const baseCharLimit = 800;
            const fontFactor = 18 / fontPx;
            const maxCharsPerPage = Math.round(baseCharLimit * fontFactor);

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = contentHtml;

            const elements = Array.from(tempDiv.children);
            const pages = [];
            let currentPage = "";
            let currentLen = 0;

            const pArray = elements.length > 0 
                ? elements.map(el => el.outerHTML) 
                : contentHtml.split('\n').filter(t => t.trim() !== '').map(t => `<p>${t}</p>`);

            pArray.forEach(htmlChunk => {
                const textOnly = htmlChunk.replace(/<[^>]*>?/gm, '');
                const chunkLen = textOnly.length;

                if (currentLen + chunkLen > maxCharsPerPage && currentPage !== "") {
                    pages.push(currentPage);
                    currentPage = htmlChunk;
                    currentLen = chunkLen;
                } else {
                    currentPage += htmlChunk;
                    currentLen += chunkLen;
                }
            });

            if (currentPage.trim() !== "") {
                pages.push(currentPage);
            }

            return pages.length > 0 ? pages : [contentHtml];
        }

        window.onload = function() {
            // Restore theme
            const savedTheme = localStorage.getItem('ebook_theme') || 'light';
            setTheme(savedTheme);

            // Restore font size
            const savedFontSize = localStorage.getItem('ebook_fontsize') || '18';
            document.getElementById('fontSizeSlider').value = savedFontSize;
            changeFontSize(savedFontSize);

            // Restore font family
            const savedFontFamily = localStorage.getItem('ebook_fontfamily') || 'noto';
            setFontFamily(savedFontFamily);

            // Render Book List Drawer
            renderBookList();

            // Restore Bookmark / Progress
            const savedBookmark = localStorage.getItem('ebook_bookmark');
            if(savedBookmark) {
                try {
                    const parsed = JSON.parse(savedBookmark);
                    currentBookIndex = parsed.bookIndex || 0;
                    currentPageIndex = parsed.pageIndex || 0;
                    isBookmarked = true;
                } catch(e) {}
            }

            // Load Content
            loadBook(currentBookIndex, currentPageIndex);
        };

        // Theme Switcher
        function setTheme(theme) {
            document.body.classList.remove('theme-light', 'theme-sepia', 'theme-dark');
            document.body.classList.add(`theme-${theme}`);
            localStorage.setItem('ebook_theme', theme);
        }

        // Font Size Adjuster with Dynamic Page Break recalculation
        function changeFontSize(size) {
            const storyArticle = document.getElementById('storyArticle');
            if(storyArticle) {
                storyArticle.style.fontSize = size + 'px';
            }
            const label = document.getElementById('fontSizeLabel');
            if(label) {
                if(size <= 14) label.innerText = "Small";
                else if(size <= 18) label.innerText = "Medium";
                else if(size <= 22) label.innerText = "Large";
                else label.innerText = "Extra Large";
            }
            localStorage.setItem('ebook_fontsize', size);

            // Recalculate auto page breaks when font size changes
            if (booksData[currentBookIndex]) {
                const fontPx = parseInt(size, 10);
                const book = booksData[currentBookIndex];
                book.pages = autoPaginate(book.content || (book.pages ? book.pages.join('') : ''), fontPx);
                renderPage();
            }
        }

        // Font Family Switcher
        function setFontFamily(font) {
            const article = document.getElementById('storyArticle');
            if(!article) return;
            if(font === 'noto') {
                article.classList.remove('font-padauk');
                article.classList.add('font-noto');
            } else {
                article.classList.remove('font-noto');
                article.classList.add('font-padauk');
            }
            localStorage.setItem('ebook_fontfamily', font);
        }

        // Drawer Controls
        function openTOC() {
            document.getElementById('tocBackdrop').classList.remove('hidden');
            document.getElementById('tocDrawer').classList.remove('-translate-x-full');
        }

        function closeTOC() {
            document.getElementById('tocBackdrop').classList.add('hidden');
            document.getElementById('tocDrawer').classList.add('-translate-x-full');
        }

        // Settings Modal Controls
        function openSettings() {
            document.getElementById('settingsBackdrop').classList.remove('hidden');
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsBackdrop').classList.add('hidden');
            document.getElementById('settingsModal').classList.add('hidden');
        }

        // Render Book List Drawer
        function renderBookList() {
            const container = document.getElementById('bookListContainer');
            if(!container) return;
            container.innerHTML = booksData.map((book, idx) => `
                <button onclick="selectBook(${idx})" class="w-full text-left p-3 rounded-xl hover:bg-amber-500/10 transition flex items-center justify-between border ${idx === currentBookIndex ? 'border-amber-500 bg-amber-500/5' : 'border-transparent'}">
                    <div>
                        <div class="font-bold text-sm">${book.title}</div>
                        <div class="text-xs sepia-text-muted mt-0.5">Author - ${book.author}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
                </button>
            `).join('');
        }

        // Load specific book and page
        function loadBook(bookIdx, pageIdx = 0) {
            currentBookIndex = bookIdx;
            currentPageIndex = pageIdx;
            
            const currentBook = booksData[currentBookIndex];
            document.getElementById('headerTitle').innerText = currentBook.title;

            // Generate auto-paginated pages from full content
            const savedFontSize = parseInt(localStorage.getItem('ebook_fontsize') || '18', 10);
            currentBook.pages = autoPaginate(currentBook.content || (currentBook.pages ? currentBook.pages.join('') : ''), savedFontSize);

            renderPage();
            renderBookList();
            updateBookmarkUI();
        }

        // Render Current Page
        function renderPage() {
            const currentBook = booksData[currentBookIndex];
            const totalPages = currentBook.pages.length;

            if (currentPageIndex >= totalPages) currentPageIndex = totalPages - 1;
            if (currentPageIndex < 0) currentPageIndex = 0;

            // Render text
            document.getElementById('pageContent').innerHTML = currentBook.pages[currentPageIndex];

            // Update Page Indicators
            const pageText = `page (${currentPageIndex + 1} / ${totalPages})`;
            document.getElementById('headerPageIndicator').innerText = pageText;
            document.getElementById('bottomPageLabel').innerText = `${currentPageIndex + 1} / ${totalPages}`;

            // Buttons state
            document.getElementById('prevPageBtn').disabled = (currentPageIndex === 0);
            document.getElementById('nextPageBtn').disabled = (currentPageIndex === totalPages - 1);

            // Progress bar
            const scrolled = ((currentPageIndex + 1) / totalPages) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";

            // Scroll to top of article
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Change Page
        function changePage(direction) {
            currentPageIndex += direction;
            renderPage();
        }

        // Select Book
        function selectBook(index) {
            closeTOC();
            loadBook(index, 0);
        }

        // Bookmark Handler
        function toggleBookmark() {
            isBookmarked = !isBookmarked;
            if(isBookmarked) {
                const bookmarkData = {
                    bookIndex: currentBookIndex,
                    pageIndex: currentPageIndex
                };
                localStorage.setItem('ebook_bookmark', JSON.stringify(bookmarkData));
                showToast("page bookmarked");
            } else {
                localStorage.removeItem('ebook_bookmark');
                showToast("bookmark removed");
            }
            updateBookmarkUI();
        }

        function updateBookmarkUI() {
            const icon = document.getElementById('bookmarkIcon');
            const mobileIcon = document.getElementById('mobileBookmarkIcon');
            if(isBookmarked) {
                if(icon) icon.className = "fa-solid fa-bookmark text-lg text-amber-600";
                if(mobileIcon) mobileIcon.className = "fa-solid fa-bookmark text-base mb-0.5";
            } else {
                if(icon) icon.className = "fa-regular fa-bookmark text-lg";
                if(mobileIcon) mobileIcon.className = "fa-regular fa-bookmark text-base mb-0.5";
            }
        }

        // Scroll to top helper
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Share button function
        function shareNovel() {
            const title = booksData[currentBookIndex].title;
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: `${title} - Read now`,
                    url: window.location.href
                }).catch(() => {});
            } else {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast("copied to clipboard");
            }
        }

        // Toast Notification System
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            if(!toast || !toastMsg) return;
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
